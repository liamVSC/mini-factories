name: Sync committed browser runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-dist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build browser runtime
        run: npm run build
      - name: Commit generated runtime when needed
        run: |
          if git diff --quiet -- dist; then
            echo "Committed dist is already reproducible."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "chore: sync compiled browser runtime"
          git push
