name: repair-core-test
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-core-test]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore regression suite and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git checkout 584ef2b7a627508f3f119977dc18a4eab965ac61 -- tests/core.test.js
          sed -i "s/MINI_FACTORIES_VERSION,'1.4'/MINI_FACTORIES_VERSION,'1.5'/" tests/core.test.js
          rm -f .github/workflows/repair-core-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/core.test.js .github/workflows/repair-core-test.yml
          git commit -m 'Restore full core regression suite for v1.5 [repair-core-test]'
          git push