name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests
        run: node --test tests/*.test.js
      - name: Check syntax
        run: node --check src/game.js && node --check src/render3d.js && node --check src/render.js && node --check src/state.js && node --check src/world.js && node --check src/economy.js
