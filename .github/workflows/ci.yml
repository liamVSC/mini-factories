name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Run TypeScript typecheck
        run: npm run typecheck
      - name: Build browser runtime
        run: npm run build
      - name: Verify committed browser runtime is reproducible
        run: |
          git diff --exit-code -- dist ':!dist/version.js.map'
          node --input-type=module -e "import fs from 'node:fs'; import {execFileSync} from 'node:child_process'; const committed=execFileSync('git',['show','HEAD:dist/version.js.map'],{encoding:'utf8'}); const generated=fs.readFileSync('dist/version.js.map','utf8'); const normalize=value=>value.replace(/\s+$/,''); if(normalize(committed)!==normalize(generated)){console.error('dist/version.js.map differs from the committed source map after trailing-whitespace normalization');process.exit(1)}"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real browser road audit
        run: mkdir -p test-results && timeout --signal=TERM --kill-after=30s 6m npm run test:visual
      - name: Upload road audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: road-render-audit
          path: test-results/
          if-no-files-found: ignore
      - name: Run test suite
        run: timeout --signal=TERM --kill-after=30s 8m npm test
