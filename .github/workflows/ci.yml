name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: false

      - name: Print toolchain
        run: |
          node --version
          npm --version
          npx playwright --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Clean generated browser runtime
        run: rm -rf dist

      - name: Build browser runtime
        run: npm run build

      - name: Verify committed browser runtime is reproducible
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import {execFileSync} from 'node:child_process'; const files=['dist/index.js','dist/game.js','dist/render3d.js']; const normalize=s=>s.replace(/\\r\\n/g,'\\n').replace(/\\n+$/,''); for(const file of files){const committed=execFileSync('git',['show','HEAD:'+file],{encoding:'utf8'}); const generated=fs.readFileSync(file,'utf8'); if(normalize(committed)!==normalize(generated)){console.error(file+' differs from the committed runtime after newline normalization'); process.exit(1);}}"
          test -f dist/index.js
          test -f dist/game.js
          test -f dist/render3d.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real browser road audit
        run: |
          mkdir -p test-results
          timeout --signal=TERM --kill-after=30s 6m npm run test:visual

      - name: Upload road audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: road-render-audit
          path: test-results/
          if-no-files-found: ignore

      - name: Run full test suite
        run: timeout --signal=TERM --kill-after=30s 8m npm test

      - name: Verify working tree is clean
        run: git diff --exit-code -- . ':(exclude)test-results'
