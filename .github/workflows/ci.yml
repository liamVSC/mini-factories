name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: false

      - name: Print toolchain
        run: |
          node --version
          npm --version
          npx playwright --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Clean generated browser runtime
        run: rm -rf dist

      - name: Build browser runtime
        run: npm run build

      - name: Verify committed browser runtime is reproducible
        run: |
          mapfile -t runtime_files < <(find dist -type f -name '*.js' -print)
          git diff --exit-code --ignore-space-at-eol -- ${runtime_files[@]}
          test -f dist/index.js
          test -f dist/game.js
          test -f dist/render3d.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real browser road audit
        run: |
          mkdir -p test-results
          timeout --signal=TERM --kill-after=30s 6m npm run test:visual

      - name: Upload road audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: road-render-audit
          path: test-results/
          if-no-files-found: ignore

      - name: Run full test suite
        run: timeout --signal=TERM --kill-after=30s 8m npm test

      - name: Verify working tree is clean
        run: git diff --exit-code -- . ':(exclude)test-results'
