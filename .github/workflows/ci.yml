name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repair truncated world module if present
        if: contains(github.event.head_commit.message, 'one-time recovery')
        run: |
          if grep -q "return... (truncated)" src/world.js; then
            git restore --source=016b5bebebbce779ea1eb7eb5e9b41859cb21b28 -- src/world.js
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/world.js
            git commit -m "Restore world module after failed road fix"
            git push origin HEAD:main
          fi
      - name: Run test suite
        run: npm test
