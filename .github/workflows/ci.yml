name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run TypeScript typecheck
        run: npm run typecheck
      - name: Build browser runtime
        run: npm run build
      - name: Sync committed browser runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- dist; then
            echo "Committed browser runtime is already reproducible."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "chore: sync compiled browser runtime"
          git push
      - name: Verify committed browser runtime is reproducible
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: git diff --exit-code -- dist
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real browser road audit
        run: mkdir -p test-results && timeout --signal=TERM --kill-after=30s 6m npm run test:visual
      - name: Upload road audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: road-render-audit
          path: test-results/
          if-no-files-found: ignore
      - name: Run test suite
        run: timeout --signal=TERM --kill-after=30s 8m npm test
