<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mini Factories</title><link rel="stylesheet" href="styles.css?v=1.3.2"></head><body><canvas id="game"></canvas><div id="ui"><div class="top"><div class="card stat"><span>Cash</span><b id="cash">£500</b></div><div class="card stat"><span>Orders</span><b id="orders">0</b></div><div class="card stat"><span>Company Lv</span><b id="companyLevel">1</b></div><div class="grow"></div></div><div class="actions"><button id="road">🛣️ Road</button><button id="erase">⌫ Erase</button><button id="build">🏗️ Build</button><button id="research">🔬 Research</button><button id="company">🏢 Company</button><button id="settings">⚙️ Settings</button></div><div id="panel" class="card panel"><b id="name">Factory</b><div class="row"><span>Type</span><b id="type">Factory</b></div><div class="row"><span>Status</span><b id="info">—</b></div><button class="upgrade" id="shop">🏪 Upgrade shop</button><button class="upgrade" id="u1">⚡ Faster machines<small>Increase production speed.</small></button><button class="upgrade" id="u2">📦 Bigger storage<small>Increase factory storage.</small></button><button class="upgrade" id="u3">🚚 Loading bay<small>Faster dispatch and higher value.</small></button><button class="upgrade" id="u4">🧭 Logistics<small>Reduce congestion impact.</small></button></div><div id="tip" class="card">Build roads between factories and shops.</div><div id="objective" class="card"></div></div><div id="settingsMenu" class="pause"><div class="box card"><h1>Settings</h1><div class="settings-row"><span>Game version</span><b id="gameVersion">v1.2</b></div><div class="settings-row"><span>Save system</span><b>Local</b></div><button id="newgame">🆕 New Game</button><button id="settingsClose">Close</button></div></div><div id="gameOver" class="modal"><div class="box card"><h1>Factory Closed</h1><p id="score"></p><button id="again">Start a new factory</button></div></div><script type="module" src="src/game.js?v=1.3.2"></script></body></html>
