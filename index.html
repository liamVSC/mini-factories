<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mini Factories</title><link rel="stylesheet" href="styles.css?v=1.0.5"></head><body><canvas id="game"></canvas><div id="ui"><div class="top"><div class="card stat cash-stat"><span>Cash</span><b id="cash">£500</b></div><div class="card stat"><span>Orders</span><b id="orders">0</b></div><div class="card stat"><span>Company</span><b>Lv <i id="companyLevel">1</i></b><div class="level-track"><span id="levelProgress"></span></div></div><div class="card stat"><span>Traffic</span><b id="traffic">0%</b></div><div class="grow"></div></div><div class="actions"><button id="road">🛣️ Road</button><button id="erase" title="Edit roads: hover a segment, tap to remove, double-tap to split">🛠️ Edit Road</button><button id="build">🏗️ Build</button><button id="research">🔬 Research</button><button id="company">🏢 Company</button><button id="settings">⚙️ Settings</button><button id="cameraHome" aria-label="Reset camera">⌂ Home</button></div><div id="buildMenu" class="build-menu" aria-hidden="true"><div class="build-menu-head"><div><b>Build</b><small>Drag a building onto the map</small></div><div class="build-cash">£500</div><button id="buildMenuClose" class="panel-close" aria-label="Close build menu">×</button></div><div id="buildCards" class="build-cards"></div></div><div id="buildGhost" class="build-ghost"><span>🏭</span><b>Factory</b><small>Release to build</small></div><div id="panel" class="card panel"><div class="panel-head"><div><b id="name">Factory</b><small id="panelHint">Building details</small></div><button id="panelClose" class="panel-close" aria-label="Close panel">×</button></div><div class="row"><span>Type</span><b id="type">Factory</b></div><div class="row"><span>Status</span><b id="info">—</b></div><button class="upgrade" id="shop">🏪 Upgrade shop</button><button class="upgrade" id="u1">⚡ Faster machines<small>Increase production speed.</small></button><button class="upgrade" id="u2">📦 Bigger storage<small>Increase factory storage.</small></button><button class="upgrade" id="u3">🚚 Loading bay<small>Faster dispatch and higher value.</small></button><button class="upgrade" id="u4">🧭 Logistics<small>Reduce congestion impact.</small></button></div><div id="tip" class="card">Build roads between factories and shops.</div><div id="objective" class="card"></div></div><div id="settingsMenu" class="pause"><div class="box card"><h1>Settings</h1><div class="settings-row"><span>Game version</span><b id="gameVersion">v1.0.5</b></div><div class="settings-row"><span>Save system</span><b>Local</b></div><div class="change-log"><h2>Change log</h2><div id="changeLog" class="changelog-list"></div></div><button id="newgame">🆕 New Game</button><button id="settingsClose">Close</button></div></div><div id="gameOver" class="modal"><div class="box card"><h1>Factory Closed</h1><p id="score"></p><button id="again">Start a new factory</button></div></div><script type="module" src="src/game.js?v=1.0.5"></script></body></html>
