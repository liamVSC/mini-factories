<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mini Factories</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#080b10;color:#f4f7fb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
.top{display:flex;gap:9px;align-items:center;padding:12px 14px;position:absolute;left:0;right:0;top:0}
.card{background:rgba(14,19,27,.9);border:1px solid rgba(255,255,255,.09);border-radius:14px;box-shadow:0 10px 35px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.035);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.stat{min-width:88px;padding:8px 12px}
.stat span{display:block;font-size:9px;color:#7f8b9b;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.stat b{display:block;margin-top:2px;font-size:18px;line-height:1.1;letter-spacing:-.02em}
.stat:first-child b{color:#b8f58a}
.grow{flex:1}
button{pointer-events:auto;border:1px solid rgba(255,255,255,.1);background:rgba(21,27,36,.95);color:#eaf0f6;border-radius:11px;padding:9px 13px;font-weight:800;cursor:pointer;transition:.15s transform,.15s background,.15s border-color;box-shadow:0 5px 15px rgba(0,0,0,.16)}
button:hover{background:#202936;border-color:rgba(255,255,255,.18)}
button:active{transform:translateY(1px) scale(.98)}
button.active{border-color:#7dd3fc;background:linear-gradient(180deg,#173d52,#123044);box-shadow:0 0 0 1px #7dd3fc22,0 6px 18px #0004}
#road{color:#dff6ff}
#erase{color:#ffd0d0}
#pause{color:#dce3ed}
#tip{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(14,19,27,.9);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:10px 15px;font-size:12px;text-align:center;max-width:min(560px,92vw);box-shadow:0 10px 30px #0005;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#tip b{color:#fff}
#panel{position:absolute;right:14px;top:78px;width:270px;padding:16px;pointer-events:auto;display:none}
#pname{display:block;font-size:17px;letter-spacing:-.02em;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;margin:9px 0;color:#8f9bad;font-size:12px}
.row b{color:#f5f7fa}
.upgrade{width:100%;margin-top:8px;text-align:left;padding:11px 12px}
.upgrade small{display:block;color:#7f8b9b;font-weight:500;margin-top:4px;line-height:1.3}
#over{position:fixed;inset:0;display:none;place-items:center;background:rgba(3,5,8,.78);z-index:5;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modal{width:min(430px,90vw);background:#101620;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:30px;text-align:center;box-shadow:0 25px 80px #0008}
.modal h1{margin:0 0 8px;font-size:36px;letter-spacing:-.04em}.modal p{color:#9eabbc}.modal button{margin-top:8px}
canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-tap-highlight-color:transparent}
@media(max-width:700px){
 #tip::after{content:"  •  Pinch to zoom";color:#7f8b9b}
}
@media(max-width:700px){
 body{overscroll-behavior:none}
 .top{padding:0;display:block;position:static}
 .top .stat{position:fixed;top:max(8px,env(safe-area-inset-top));z-index:3;min-width:0;width:calc((100vw - 32px)/4);padding:7px 5px;text-align:center;border-radius:12px}
 .top .stat:nth-child(1){left:8px}
 .top .stat:nth-child(2){left:calc(25% + 0px)}
 .top .stat:nth-child(3){left:calc(50% - 8px)}
 .top .stat:nth-child(4){right:8px}
 .stat b{font-size:15px}.stat span{font-size:8px}
 .grow{display:none}
 .top button{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));z-index:4;height:52px;min-width:0;padding:8px 5px;font-size:12px;border-radius:14px;box-shadow:0 8px 25px rgba(0,0,0,.38)}
 #road{left:8px;width:calc(33.333% - 11px)}
 #erase{left:calc(33.333% + 4px);width:calc(33.333% - 8px)}
 #pause{right:8px;width:calc(33.333% - 11px)}
 #panel{right:8px;left:8px;top:auto;bottom:calc(74px + env(safe-area-inset-bottom));width:auto;max-height:min(42vh,360px);overflow:auto;padding:14px;border-radius:16px;box-shadow:0 16px 45px rgba(0,0,0,.48)}
 #pname{font-size:16px}
 .row{margin:7px 0}
 .upgrade{min-height:52px;margin-top:7px}
 #tip{left:8px;right:8px;bottom:calc(72px + env(safe-area-inset-bottom));transform:none;max-width:none;font-size:11px;padding:8px 10px;border-radius:11px}
 canvas{touch-action:none}
}
@media(max-width:420px){
 .top .stat{top:max(7px,env(safe-area-inset-top));width:calc((100vw - 26px)/4);padding:6px 3px}
 .top .stat:nth-child(1){left:5px}
 .top .stat:nth-child(2){left:calc(25% - 1px)}
 .top .stat:nth-child(3){left:calc(50% - 7px)}
 .top .stat:nth-child(4){right:5px}
 .stat b{font-size:14px}
 .stat span{font-size:7px}
 .top button{bottom:max(7px,env(safe-area-inset-bottom));height:50px;font-size:11px}
 #road{left:5px;width:calc(33.333% - 7px)}
 #erase{left:calc(33.333% + 3px);width:calc(33.333% - 6px)}
 #pause{right:5px;width:calc(33.333% - 7px)}
 #panel{left:5px;right:5px;bottom:calc(65px + env(safe-area-inset-bottom));max-height:45vh}
 #tip{display:none}
}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="top">
    <div class="card stat"><span>Cash</span><b id="cash">£500</b></div>
    <div class="card stat"><span>Orders</span><b id="del">0</b></div>
    <div class="card stat"><span>Week</span><b id="week">1</b></div>
    <div class="card stat"><span>Best</span><b id="best">0</b></div>
    <div class="grow"></div>
    <button id="road">🛣️ Road <span id="roads">0</span></button>
    <button id="erase">⌫ Erase</button>
    <button id="pause">Ⅱ Pause</button>
  </div>
  <div id="panel" class="card">
    <b id="pname">Factory</b>
    <div class="row"><span>Type</span><b id="ptype">Factory</b></div>
    <div class="row"><span>Output</span><b id="pout">—</b></div>
    <div class="row"><span>Demand</span><b id="pdemand">—</b></div>
    <button class="upgrade" id="up1">⚡ Faster machines £120<small>Increase production speed.</small></button>
    <button class="upgrade" id="up2">📦 Bigger storage £180<small>Hold more goods before blocking.</small></button>
  </div>
  <div id="tip">🛣️ <b>Build your network</b> — drag roads through the city and keep every shop supplied.</div>
</div>
<div id="over"><div class="modal"><h1>Factory Closed</h1><p id="scoreline"></p><button id="again">Start a new factory</button></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,dpr,mouse={x:0,y:0,down:false},drag=null,selected=null,paused=false,mode='select',last=performance.now();
let pointerStart=null,pointerMoved=false,pointers=new Map(),panStart=null;
let camera={x:0,y:0,zoom:1},gesture=null,world={minX:0,maxX:0,minY:0,maxY:0};
let cash=500,delivered=0,week=1,weekTimer=0,roadBudget=10,gameOver=false,saveTimer=0;
let roads=[],buildings=[],trucks=[],particles=[],nextSpawn=10,congestion=0,roadGraphCache=null;
let upgrades={speed:0,storage:0};
let trafficLights=[],junctionCache=null;
const types=[
 {name:'Steel',color:'#8bd5ff',price:24,icon:'S',kind:'factory'},
 {name:'Food',color:'#a7e66f',price:18,icon:'F',kind:'factory'},
 {name:'Parts',color:'#c5a7ff',price:30,icon:'P',kind:'factory'},
 {name:'Market',color:'#ffd166',need:'Food',kind:'shop'},
 {name:'Garage',color:'#ff8f8f',need:'Parts',kind:'shop'},
 {name:'Builder',color:'#f4a261',need:'Steel',kind:'shop'}
];
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function rnd(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function spawn(kind,forcedType){
 const pool=types.filter(x=>x.kind===kind&&(!forcedType||x.name===forcedType));
 const t=pool[Math.floor(Math.random()*pool.length)];
 let x,y,ok=false;
 const margin=110;
 for(let n=0;n<250&&!ok;n++){
  if(buildings.length<6){
   x=rnd(world.minX+margin,world.maxX-margin); y=rnd(world.minY+margin,world.maxY-margin);
  }else{
   const angle=rnd(0,Math.PI*2),radius=rnd(170,300);
   const anchor=buildings[Math.floor(Math.random()*buildings.length)];
   x=anchor.x+Math.cos(angle)*radius; y=anchor.y+Math.sin(angle)*radius;
  }
  ok=buildings.every(b=>dist(b,{x,y})>125);
 }
 if(!ok)return null;
 world.minX=Math.min(world.minX,x-140);world.maxX=Math.max(world.maxX,x+140);
 world.minY=Math.min(world.minY,y-140);world.maxY=Math.max(world.maxY,y+140);
 const b={id:crypto.randomUUID(),x,y,r:23,type:t.name,color:t.color,kind:t.kind,need:t.need||null,
 level:0,stock:0,max:kind==='factory'?4:8,prod:0,demand:kind==='shop'?rnd(2.8,5):0,pulse:Math.random()*6.28,served:0};
 buildings.push(b);return b;
}
function resetCamera(){camera={x:W/2,y:H/2,zoom:1};world={minX:-W/2,maxX:W/2,minY:-H/2,maxY:H/2};}
function screenToWorld(x,y){return{x:(x-camera.x)/camera.zoom+W/2,y:(y-camera.y)/camera.zoom+H/2}}
const SAVE_KEY='miniFactoriesSaveV2';
function serializeGame(){
 return {
  version:2,cash,delivered,week,weekTimer,roadBudget,nextSpawn,congestion,upgrades,
  roads:roads.map(r=>({id:r.id,points:r.points,cost:r.cost,age:r.age,bridge:!!r.bridge})),
  buildings:buildings.map(b=>({id:b.id,x:b.x,y:b.y,r:b.r,type:b.type,color:b.color,kind:b.kind,need:b.need||null,level:b.level,stock:b.stock,max:b.max,prod:b.prod,demand:b.demand,pulse:b.pulse,served:b.served})),
  trafficLights:trafficLights.map(p=>({x:p.x,y:p.y})),
  camera:{x:camera.x,y:camera.y,zoom:camera.zoom}
 };
}
function saveGame(){
 if(gameOver)return;
 try{localStorage.setItem(SAVE_KEY,JSON.stringify(serializeGame()));}catch(e){}
}
function loadGame(){
 try{
  const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
  const d=JSON.parse(raw);if(!d||d.version!==2||!Array.isArray(d.buildings)||!Array.isArray(d.roads))return false;
  cash=Number.isFinite(d.cash)?d.cash:500;delivered=Number.isFinite(d.delivered)?d.delivered:0;
  week=Number.isFinite(d.week)?d.week:1;weekTimer=Number.isFinite(d.weekTimer)?d.weekTimer:0;
  roadBudget=Number.isFinite(d.roadBudget)?d.roadBudget:10;nextSpawn=Number.isFinite(d.nextSpawn)?d.nextSpawn:10;
  congestion=Number.isFinite(d.congestion)?d.congestion:0;
  upgrades=d.upgrades||{speed:0,storage:0};
  trafficLights=Array.isArray(d.trafficLights)?d.trafficLights.map(p=>({x:+p.x,y:+p.y})):[];
  roads=d.roads.filter(r=>Array.isArray(r.points)&&r.points.length>=2).map(r=>({...r,bridge:!!r.bridge,points:r.points.map(p=>({x:+p.x,y:+p.y}))}));
  buildings=d.buildings.map(b=>({...b}));
  trucks=[];particles=[];roadGraphCache=null;junctionCache=null;gameOver=false;paused=false;
  if(d.camera&&Number.isFinite(d.camera.zoom))camera={x:Number.isFinite(d.camera.x)?d.camera.x:W/2,y:Number.isFinite(d.camera.y)?d.camera.y:H/2,zoom:Math.max(.65,Math.min(1.8,d.camera.zoom))};
  else resetCamera();
  world={minX:-W/2,maxX:W/2,minY:-H/2,maxY:H/2};
  for(const b of buildings){world.minX=Math.min(world.minX,b.x-180);world.maxX=Math.max(world.maxX,b.x+180);world.minY=Math.min(world.minY,b.y-180);world.maxY=Math.max(world.maxY,b.y+180)}
  hidePanel();document.getElementById('pause').textContent='Pause';document.getElementById('over').style.display='none';updateUI();
  return true;
 }catch(e){return false}
}
function start(){
 try{localStorage.removeItem(SAVE_KEY)}catch(e){}
 cash=500;delivered=0;week=1;weekTimer=0;roadBudget=10;gameOver=false;paused=false;
 roads=[];buildings=[];trucks=[];particles=[];nextSpawn=18;congestion=0;roadGraphCache=null;junctionCache=null;upgrades={speed:0,storage:0};trafficLights=[];resetCamera();
 mode='select';document.getElementById('road').classList.remove('active');document.getElementById('erase').classList.remove('active');
 for(const t of ['Steel','Food','Parts'])spawn('factory',t);
 for(const t of ['Market','Garage','Builder'])spawn('shop',t);
 hidePanel();document.getElementById('pause').textContent='Pause';document.getElementById('over').style.display='none';updateUI();
}
if(!loadGame())start();
function bAt(x,y){return buildings.find(b=>Math.hypot(b.x-x,b.y-y)<b.r+10)}
function pointSegDistance(p,a,b){
 const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;
 if(!l)return dist(p,a);
 let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l;t=Math.max(0,Math.min(1,t));
 return Math.hypot(p.x-(a.x+dx*t),p.y-(a.y+dy*t));
}
function roadTouchesBuilding(r,b){return r.points.some(p=>dist(p,b)<b.r+14)}
function roadIntersectsRoad(a,b){
 for(let i=0;i<a.points.length-1;i++)for(let j=0;j<b.points.length-1;j++){
  if(segmentsCross(a.points[i],a.points[i+1],b.points[j],b.points[j+1]))return true;
 }return false;
}
function segmentsCross(a,b,c,d){
 const ccw=(p1,p2,p3)=>(p3.y-p1.y)*(p2.x-p1.x)>(p2.y-p1.y)*(p3.x-p1.x);
 return ccw(a,c,d)!==ccw(b,c,d)&&ccw(a,b,c)!==ccw(a,b,d);
}
function connected(a,b){
 if(a===b)return true;
 return !!findRoute(a,b);
}
function pathLength(points){let n=0;for(let i=1;i<points.length;i++)n+=dist(points[i-1],points[i]);return n}
function segIntersection(a,b,c,d){
 const x1=a.x,y1=a.y,x2=b.x,y2=b.y,x3=c.x,y3=c.y,x4=d.x,y4=d.y;
 const den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
 if(Math.abs(den)<1e-9)return null;
 const t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/den;
 const u=-((x1-x2)*(y1-y3)-(y1-y2)*(x1-x3))/den;
 if(t<-1e-7||t>1.0000001||u<-1e-7||u>1.0000001)return null;
 return{x:x1+t*(x2-x1),y:y1+t*(y2-y1),t,u};
}
function buildRoadGraph(){
 const nodes=[],edges=[];
 const nodeAt=(p)=>{
  for(const n of nodes)if(dist(n,p)<1.5)return n;
  const n={id:nodes.length,x:p.x,y:p.y};nodes.push(n);return n;
 };
 const edge=(a,b)=>{
  if(a===b)return;
  const w=dist(a,b);
  if(w<.01)return;
  edges.push({a,b,w});
 };
 for(const r of roads){
  for(let i=0;i<r.points.length-1;i++){
   const a=r.points[i],b=r.points[i+1],cuts=[{t:0,p:a},{t:1,p:b}];
   for(const rr of roads){
    if(rr===r)continue;
    for(let j=0;j<rr.points.length-1;j++){
     const hit=segIntersection(a,b,rr.points[j],rr.points[j+1]);
     if(hit)cuts.push({t:hit.t,p:{x:hit.x,y:hit.y}});
    }
   }
   cuts.sort((u,v)=>u.t-v.t);
   for(let k=0;k<cuts.length;k++)nodeAt(cuts[k].p);
   for(let k=1;k<cuts.length;k++)edge(nodeAt(cuts[k-1].p),nodeAt(cuts[k].p));
  }
 }
 const graph=new Map(nodes.map(n=>[n,[]]));
 for(const e of edges){graph.get(e.a).push({to:e.b,w:e.w});graph.get(e.b).push({to:e.a,w:e.w});}
 return {nodes,graph};
}
function nearestRoadNode(graph,b){
 let best=null,bd=b.r+18;
 for(const n of graph.nodes){const d=dist(n,b);if(d<bd){bd=d;best=n}}
 return best;
}
function findRoute(a,b){
 if(a===b)return [];
 // Fast path: a single road can directly connect two buildings.
 for(const r of roads){
  if(roadTouchesBuilding(r,a)&&roadTouchesBuilding(r,b)){
   const forward=dist(r.points[0],a)<=dist(r.points[r.points.length-1],a);
   const pts=forward?r.points:[...r.points].reverse();
   return {points:[{x:a.x,y:a.y},...pts,{x:b.x,y:b.y}],distance:pathLength(pts)+dist(a,pts[0])+dist(pts[pts.length-1],b)};
  }
 }
 if(roadGraphCache===null)roadGraphCache=buildRoadGraph();
 if(!roads.length)return null;
 const {nodes,graph}=roadGraphCache;
 const start=nearestRoadNode({nodes},a),goal=nearestRoadNode({nodes},b);
 if(!start||!goal)return null;
 const distMap=new Map(nodes.map(n=>[n,Infinity])),prev=new Map(),open=[start];
 distMap.set(start,0);
 while(open.length){
  let bi=0;for(let i=1;i<open.length;i++)if(distMap.get(open[i])<distMap.get(open[bi]))bi=i;
  const cur=open.splice(bi,1)[0];
  if(cur===goal)break;
  for(const e of graph.get(cur)){
   const nd=distMap.get(cur)+e.w;
   if(nd<distMap.get(e.to)){distMap.set(e.to,nd);prev.set(e.to,cur);if(!open.includes(e.to))open.push(e.to)}
  }
 }
 if(!prev.has(goal)&&goal!==start)return null;
 const route=[];let cur=goal;while(cur){route.push({x:cur.x,y:cur.y});if(cur===start)break;cur=prev.get(cur)}
 route.reverse();
 if(route.length)route.unshift({x:a.x,y:a.y}),route.push({x:b.x,y:b.y});
 return {points:route,distance:distMap.get(goal)};
}
function simplify(points){
 const out=[];for(const p of points){const last=out[out.length-1];if(!last||dist(last,p)>10)out.push(p)}
 return out;
}
function nearestRoadPoint(p){
 let best=null,bd=22;
 for(const r of roads){
  for(let i=1;i<r.points.length;i++){
   const a=r.points[i-1],b=r.points[i],dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;
   if(!l)continue;
   let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l;t=Math.max(0,Math.min(1,t));
   const q={x:a.x+dx*t,y:a.y+dy*t};
   const d=dist(p,q);
   if(d<bd){bd=d;best=q}
  }
 }
 return best;
}
function snapRoadPoint(p,exclude){
 let best=null,bd=28;
 for(const b of buildings){
  if(b===exclude)continue;
  const d=dist(p,b);
  if(d<bd){bd=d;best={x:b.x,y:b.y}}
 }
 if(best)return best;
 return nearestRoadPoint(p)||p;
}
function orthogonalPath(start,end){
 const dx=Math.abs(end.x-start.x),dy=Math.abs(end.y-start.y);
 if(dx<8||dy<8)return [start,end];
 if(dx>=dy)return [start,{x:end.x,y:start.y},end];
 return [start,{x:start.x,y:end.y},end];
}
function snappedRoadPath(start,rawEnd,exclude){
 const building=snapRoadPoint(rawEnd,exclude);
 const end=building;
 return orthogonalPath(start,end);
}
function riverYAt(x){return 420+Math.sin(x*.002)*35}
function roadCrossesRiver(points){
 for(let i=1;i<points.length;i++){const a=points[i-1],b=points[i],minX=Math.min(a.x,b.x),maxX=Math.max(a.x,b.x);if(maxX-minX<1)continue;for(let k=0;k<=10;k++){const x=minX+(maxX-minX)*k/10,t=(x-a.x)/(b.x-a.x||1),y=a.y+(b.y-a.y)*t;if(Math.abs(y-riverYAt(x))<40)return true}}
 return false;
}
function addRoad(points){
 points=simplify(points);if(points.length<2)return;
 const length=pathLength(points),bridge=roadCrossesRiver(points),cost=Math.max(1,Math.ceil(length/55)+(bridge?2:0));
 if(roadBudget<cost){flash('Not enough road tiles');return}
 const a=bAt(points[0].x,points[0].y),b=bAt(points[points.length-1].x,points[points.length-1].y);
 if(!a&&!b&&length<35)return;
 roadBudget-=cost;cash-=cost*2;
 roads.push({id:crypto.randomUUID(),points,cost,age:0,bridge});roadGraphCache=null;junctionCache=null;updateTrafficLights();saveGame();
}
function removeRoadAt(x,y){
 let best=null,bd=13;
 for(const r of roads)for(let i=1;i<r.points.length;i++){const d=pointSegDistance({x,y},r.points[i-1],r.points[i]);if(d<bd){bd=d;best=r}}
 if(best){roads=roads.filter(r=>r!==best);roadGraphCache=null;junctionCache=null;updateTrafficLights();saveGame();flash('Road removed')}
}

function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;tick(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
