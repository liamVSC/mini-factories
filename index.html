<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mini Factories</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#080b10;color:#f4f7fb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
.top{display:flex;gap:9px;align-items:center;padding:12px 14px;position:absolute;left:0;right:0;top:0}
.card{background:rgba(14,19,27,.9);border:1px solid rgba(255,255,255,.09);border-radius:14px;box-shadow:0 10px 35px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.035);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.stat{min-width:88px;padding:8px 12px}
.stat span{display:block;font-size:9px;color:#7f8b9b;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.stat b{display:block;margin-top:2px;font-size:18px;line-height:1.1;letter-spacing:-.02em}
.stat:first-child b{color:#b8f58a}
.grow{flex:1}
button{pointer-events:auto;border:1px solid rgba(255,255,255,.1);background:rgba(21,27,36,.95);color:#eaf0f6;border-radius:11px;padding:9px 13px;font-weight:800;cursor:pointer;transition:.15s transform,.15s background,.15s border-color;box-shadow:0 5px 15px rgba(0,0,0,.16)}
button:hover{background:#202936;border-color:rgba(255,255,255,.18)}
button:active{transform:translateY(1px) scale(.98)}
button.active{border-color:#7dd3fc;background:linear-gradient(180deg,#173d52,#123044);box-shadow:0 0 0 1px #7dd3fc22,0 6px 18px #0004}
#road{color:#dff6ff}
#erase{color:#ffd0d0}
#pause{color:#dce3ed}
#tip{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(14,19,27,.9);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:10px 15px;font-size:12px;text-align:center;max-width:min(560px,92vw);box-shadow:0 10px 30px #0005;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#tip b{color:#fff}
#panel{position:absolute;right:14px;top:78px;width:270px;padding:16px;pointer-events:auto;display:none}
#pname{display:block;font-size:17px;letter-spacing:-.02em;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;margin:9px 0;color:#8f9bad;font-size:12px}
.row b{color:#f5f7fa}
.upgrade{width:100%;margin-top:8px;text-align:left;padding:11px 12px}
.upgrade small{display:block;color:#7f8b9b;font-weight:500;margin-top:4px;line-height:1.3}
#over{position:fixed;inset:0;display:none;place-items:center;background:rgba(3,5,8,.78);z-index:5;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modal{width:min(430px,90vw);background:#101620;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:30px;text-align:center;box-shadow:0 25px 80px #0008}
.modal h1{margin:0 0 8px;font-size:36px;letter-spacing:-.04em}.modal p{color:#9eabbc}.modal button{margin-top:8px}
canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-tap-highlight-color:transparent}
@media(max-width:700px){
 body{overscroll-behavior:none}
 .top{padding:0;display:block;position:static}
 .top .stat{position:fixed;top:max(8px,env(safe-area-inset-top));z-index:3;min-width:0;width:calc((100vw - 32px)/4);padding:7px 5px;text-align:center;border-radius:12px}
 .top .stat:nth-child(1){left:8px}
 .top .stat:nth-child(2){left:calc(25% + 0px)}
 .top .stat:nth-child(3){left:calc(50% - 8px)}
 .top .stat:nth-child(4){right:8px}
 .stat b{font-size:15px}.stat span{font-size:8px}
 .grow{display:none}
 .top button{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));z-index:4;height:52px;min-width:0;padding:8px 5px;font-size:12px;border-radius:14px;box-shadow:0 8px 25px rgba(0,0,0,.38)}
 #road{left:8px;width:calc(33.333% - 11px)}
 #erase{left:calc(33.333% + 4px);width:calc(33.333% - 8px)}
 #pause{right:8px;width:calc(33.333% - 11px)}
 #panel{right:8px;left:8px;top:auto;bottom:calc(74px + env(safe-area-inset-bottom));width:auto;max-height:min(42vh,360px);overflow:auto;padding:14px;border-radius:16px;box-shadow:0 16px 45px rgba(0,0,0,.48)}
 #pname{font-size:16px}
 .row{margin:7px 0}
 .upgrade{min-height:52px;margin-top:7px}
 #tip{left:8px;right:8px;bottom:calc(72px + env(safe-area-inset-bottom));transform:none;max-width:none;font-size:11px;padding:8px 10px;border-radius:11px}
 canvas{touch-action:none}
}
@media(max-width:420px){
 .top .stat{top:max(7px,env(safe-area-inset-top));width:calc((100vw - 26px)/4);padding:6px 3px}
 .top .stat:nth-child(1){left:5px}
 .top .stat:nth-child(2){left:calc(25% - 1px)}
 .top .stat:nth-child(3){left:calc(50% - 7px)}
 .top .stat:nth-child(4){right:5px}
 .stat b{font-size:14px}
 .stat span{font-size:7px}
 .top button{bottom:max(7px,env(safe-area-inset-bottom));height:50px;font-size:11px}
 #road{left:5px;width:calc(33.333% - 7px)}
 #erase{left:calc(33.333% + 3px);width:calc(33.333% - 6px)}
 #pause{right:5px;width:calc(33.333% - 7px)}
 #panel{left:5px;right:5px;bottom:calc(65px + env(safe-area-inset-bottom));max-height:45vh}
 #tip{display:none}
}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="top">
    <div class="card stat"><span>Cash</span><b id="cash">£500</b></div>
    <div class="card stat"><span>Orders</span><b id="del">0</b></div>
    <div class="card stat"><span>Week</span><b id="week">1</b></div>
    <div class="card stat"><span>Best</span><b id="best">0</b></div>
    <div class="grow"></div>
    <button id="road">🛣️ Road <span id="roads">0</span></button>
    <button id="erase">⌫ Erase</button>
    <button id="pause">Ⅱ Pause</button>
  </div>
  <div id="panel" class="card">
    <b id="pname">Factory</b>
    <div class="row"><span>Type</span><b id="ptype">Factory</b></div>
    <div class="row"><span>Output</span><b id="pout">—</b></div>
    <div class="row"><span>Demand</span><b id="pdemand">—</b></div>
    <button class="upgrade" id="up1">⚡ Faster machines £120<small>Increase production speed.</small></button>
    <button class="upgrade" id="up2">📦 Bigger storage £180<small>Hold more goods before blocking.</small></button>
  </div>
  <div id="tip">🛣️ <b>Build your network</b> — drag roads through the city and keep every shop supplied.</div>
</div>
<div id="over"><div class="modal"><h1>Factory Closed</h1><p id="scoreline"></p><button id="again">Start a new factory</button></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,dpr,mouse={x:0,y:0,down:false},drag=null,selected=null,paused=false,mode='road',last=performance.now();
let pointerStart=null,pointerMoved=false;
let cash=500,delivered=0,week=1,weekTimer=0,roadBudget=10,gameOver=false;
let roads=[],buildings=[],trucks=[],particles=[],nextSpawn=10,congestion=0;
let upgrades={speed:0,storage:0};
const types=[
 {name:'Steel',color:'#8bd5ff',price:24,icon:'S',kind:'factory'},
 {name:'Food',color:'#a7e66f',price:18,icon:'F',kind:'factory'},
 {name:'Parts',color:'#c5a7ff',price:30,icon:'P',kind:'factory'},
 {name:'Market',color:'#ffd166',need:'Food',kind:'shop'},
 {name:'Garage',color:'#ff8f8f',need:'Parts',kind:'shop'},
 {name:'Builder',color:'#f4a261',need:'Steel',kind:'shop'}
];
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function rnd(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function spawn(kind,forcedType){
 const pool=types.filter(x=>x.kind===kind&&(!forcedType||x.name===forcedType));
 const t=pool[Math.floor(Math.random()*pool.length)];
 let x,y,ok=false;
 for(let n=0;n<150&&!ok;n++){x=rnd(75,W-75);y=rnd(115,H-85);ok=buildings.every(b=>dist(b,{x,y})>78)}
 if(!ok)return null;
 const b={id:crypto.randomUUID(),x,y,r:23,type:t.name,color:t.color,kind:t.kind,need:t.need||null,
 level:0,stock:0,max:kind==='factory'?4:8,prod:0,demand:kind==='shop'?rnd(2.8,5):0,pulse:Math.random()*6.28,served:0};
 buildings.push(b);return b;
}
function start(){
 cash=500;delivered=0;week=1;weekTimer=0;roadBudget=10;gameOver=false;paused=false;
 roads=[];buildings=[];trucks=[];particles=[];nextSpawn=10;congestion=0;upgrades={speed:0,storage:0};
 for(const t of ['Steel','Food','Parts'])spawn('factory',t);
 for(const t of ['Market','Garage','Builder'])spawn('shop',t);
 hidePanel();document.getElementById('pause').textContent='Pause';document.getElementById('over').style.display='none';updateUI();
}
start();
function bAt(x,y){return buildings.find(b=>Math.hypot(b.x-x,b.y-y)<b.r+10)}
function pointSegDistance(p,a,b){
 const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;
 if(!l)return dist(p,a);
 let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l;t=Math.max(0,Math.min(1,t));
 return Math.hypot(p.x-(a.x+dx*t),p.y-(a.y+dy*t));
}
function roadTouchesBuilding(r,b){return r.points.some(p=>dist(p,b)<b.r+14)}
function roadIntersectsRoad(a,b){
 for(let i=0;i<a.points.length-1;i++)for(let j=0;j<b.points.length-1;j++){
  if(segmentsCross(a.points[i],a.points[i+1],b.points[j],b.points[j+1]))return true;
 }return false;
}
function segmentsCross(a,b,c,d){
 const ccw=(p1,p2,p3)=>(p3.y-p1.y)*(p2.x-p1.x)>(p2.y-p1.y)*(p3.x-p1.x);
 return ccw(a,c,d)!==ccw(b,c,d)&&ccw(a,b,c)!==ccw(a,b,d);
}
function connected(a,b){
 if(a===b)return true;
 const seen=new Set([a.id]),q=[a];
 while(q.length){
  const node=q.shift();
  for(const r of roads){
   const touchesNode=roadTouchesBuilding(r,node);
   if(!touchesNode)continue;
   for(const other of buildings){
    if(other.id===node.id||seen.has(other.id))continue;
    if(roadTouchesBuilding(r,other)){seen.add(other.id);q.push(other)}
   }
   for(const rr of roads){
    if(rr===r||!roadIntersectsRoad(r,rr))continue;
    for(const other of buildings)if(!seen.has(other.id)&&roadTouchesBuilding(rr,other)){seen.add(other.id);q.push(other)}
   }
  }
 }
 return seen.has(b.id);
}
function pathLength(points){let n=0;for(let i=1;i<points.length;i++)n+=dist(points[i-1],points[i]);return n}
function simplify(points){
 const out=[];for(const p of points){const last=out[out.length-1];if(!last||dist(last,p)>10)out.push(p)}
 return out;
}
function addRoad(points){
 points=simplify(points);if(points.length<2)return;
 const length=pathLength(points),cost=Math.max(1,Math.ceil(length/55));
 if(roadBudget<cost){flash('Not enough road tiles');return}
 const a=bAt(points[0].x,points[0].y),b=bAt(points[points.length-1].x,points[points.length-1].y);
 if(!a&&!b&&length<35)return;
 roadBudget-=cost;cash-=cost*2;
 roads.push({id:crypto.randomUUID(),points,cost,age:0});
}
function removeRoadAt(x,y){
 let best=null,bd=13;
 for(const r of roads)for(let i=1;i<r.points.length;i++){const d=pointSegDistance({x,y},r.points[i-1],r.points[i]);if(d<bd){bd=d;best=r}}
 if(best){roads=roads.filter(r=>r!==best);flash('Road removed')}
}
function flash(s){const tip=document.getElementById('tip'),old=tip.innerHTML;tip.innerHTML=s;setTimeout(()=>tip.innerHTML=old,1100)}
function select(b){
 selected=b;const p=document.getElementById('panel');p.style.display='block';
 document.getElementById('pname').textContent=b.name||b.type;
 document.getElementById('ptype').textContent=b.kind==='factory'?'Factory':'Shop';
 document.getElementById('pout').textContent=b.kind==='factory'?b.type:'Needs '+b.need;
 document.getElementById('pdemand').textContent=b.kind==='shop'?Math.ceil(b.demand):b.stock+'/'+b.max;
}
function hidePanel(){selected=null;document.getElementById('panel').style.display='none'}
function upgrade(n){
 if(!selected||selected.kind!=='factory')return;const price=n===1?120:180;
 if(cash<price)return flash('Not enough cash');
 if(n===1&&selected.level<3){cash-=price;selected.level++;flash('Machine upgraded')}
 else if(n===2&&selected.max<14){cash-=price;selected.max+=2;flash('Storage upgraded')}
 updateUI();select(selected);
}
document.getElementById('up1').onclick=()=>upgrade(1);document.getElementById('up2').onclick=()=>upgrade(2);
document.getElementById('road').onclick=()=>{mode='road';document.getElementById('road').classList.add('active');document.getElementById('erase').classList.remove('active')};
document.getElementById('erase').onclick=()=>{mode='erase';document.getElementById('erase').classList.add('active');document.getElementById('road').classList.remove('active')};
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Resume':'Pause'};
document.getElementById('again').onclick=start;
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{
 const p=pos(e);mouse={...p,down:true};pointerStart=p;pointerMoved=false;
 if(mode==='erase'){const b=bAt(p.x,p.y);if(b){roads=roads.filter(r=>!roadTouchesBuilding(r,b));buildings=buildings.filter(x=>x!==b);hidePanel();navigator.vibrate?.(12);flash('Removed')}else removeRoadAt(p.x,p.y);return}
 const b=bAt(p.x,p.y);
 if(b){select(b);drag={building:b,points:[{x:b.x,y:b.y}],armed:false};}
 else {hidePanel();drag={building:null,points:[p],armed:false};}
 canvas.setPointerCapture?.(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
 const p=pos(e);mouse={...p,down:mouse.down};
 if(!mouse.down||!drag||mode!=='road'||!pointerStart)return;
 if(dist(pointerStart,p)>12){
  pointerMoved=true;
  drag.armed=true;
  const last=drag.points[drag.points.length-1];
  if(dist(last,p)>9)drag.points.push(p);
 }
});
canvas.addEventListener('pointerup',e=>{
 const p=pos(e);mouse={...p,down:false};
 if(drag&&mode==='road'&&drag.armed){
  if(drag.building){
   const end=bAt(p.x,p.y);
   if(end&&end!==drag.building){drag.points.push({x:end.x,y:end.y});addRoad(drag.points);navigator.vibrate?.(8)}
  } else {
   drag.points.push(p);
   const end=bAt(p.x,p.y);
   if(end)drag.points[drag.points.length-1]={x:end.x,y:end.y};
   addRoad(drag.points);navigator.vibrate?.(8);
  }
 }
 if(!pointerMoved&&drag?.building)select(drag.building);
 drag=null;pointerStart=null;pointerMoved=false;
});
function nearestShop(f){
 let best=null,bd=1e9;
 for(const s of buildings)if(s.kind==='shop'&&s.need===f.type&&connected(f,s)&&s.demand>0){const d=dist(f,s);if(d<bd){bd=d;best=s}}
 return best;
}
function routeFor(f,s){
 let best=null,bd=1e9;
 for(const r of roads){
  if(roadTouchesBuilding(r,f)&&roadTouchesBuilding(r,s)){const d=pathLength(r.points);if(d<bd){bd=d;best=r}}
 }
 return best;
}
function spawnTruck(f,s){
 if(f.stock<=0||s.demand<=0)return;
 const r=routeFor(f,s);if(!r)return;
 f.stock--;s.demand--;
 const pts=r.points.slice();if(dist(pts[0],f)>dist(pts[pts.length-1],f))pts.reverse();
 trucks.push({route:pts,t:0,speed:rnd(.055,.085)*(1+f.level*.08),value:types.find(t=>t.name===f.type).price,to:s});
}
function routePoint(points,t){
 const total=pathLength(points);let want=total*t,run=0;
 for(let i=1;i<points.length;i++){const seg=dist(points[i-1],points[i]);if(run+seg>=want){const q=(want-run)/seg;return{x:points[i-1].x+(points[i].x-points[i-1].x)*q,y:points[i-1].y+(points[i].y-points[i-1].y)*q}}run+=seg}
 return points[points.length-1];
}
function addBuildingOverTime(){
 if(buildings.length>=16)return;
 const factories=buildings.filter(b=>b.kind==='factory'),shops=buildings.filter(b=>b.kind==='shop');
 const target=Math.random()<.5?shops[Math.floor(Math.random()*shops.length)]:factories[Math.floor(Math.random()*factories.length)];
 if(!target)return;
 spawn(target.kind==='shop'?'factory':'shop',target.kind==='shop'?target.need:target.type);
}
function tick(dt){
 if(paused||gameOver)return;
 weekTimer+=dt;nextSpawn-=dt;
 if(weekTimer>32){week++;weekTimer=0;roadBudget+=5;cash+=35;for(const s of buildings)if(s.kind==='shop')s.demand=Math.min(14,s.demand+rnd(1.5,3.5));flash('Week '+week+' — +5 road tiles')}
 if(nextSpawn<=0){addBuildingOverTime();nextSpawn=Math.max(6,13-week*.45)}
 for(const b of buildings){
  if(b.kind==='factory'){b.prod+=dt*(.52+b.level*.17);if(b.prod>1&&b.stock<b.max){const n=Math.floor(b.prod);b.prod-=n;b.stock=Math.min(b.max,b.stock+n)}}
  else b.demand=Math.min(14,b.demand+dt*(.055+week*.003));
 }
 for(const f of buildings.filter(b=>b.kind==='factory')){const s=nearestShop(f);if(s&&Math.random()<dt*(.85+f.level*.35))spawnTruck(f,s)}
 for(const t of trucks){t.t+=dt*t.speed;if(t.t>=1){cash+=t.value;delivered++;t.to.served++;particles.push({x:t.to.x,y:t.to.y,t:0,text:'+'+t.value});t.dead=true}}
 trucks=trucks.filter(t=>!t.dead);
 for(const r of roads)r.age+=dt;
 for(const p of particles)p.t+=dt;particles=particles.filter(p=>p.t<1);
 congestion=Math.min(1,trucks.length/Math.max(3,roads.length*2));
 cash-=roads.length*dt*.055*(1+congestion);
 if(cash<0){cash=0;gameOver=true;document.getElementById('scoreline').textContent='You delivered '+delivered+' orders across '+week+' weeks.';document.getElementById('over').style.display='grid'}
 updateUI();
}
function updateUI(){
 document.getElementById('cash').textContent='£'+Math.floor(cash);document.getElementById('del').textContent=delivered;
 document.getElementById('week').textContent=week;document.getElementById('roads').textContent=roadBudget;
 const best=Math.max(delivered,+localStorage.mfBest||0);document.getElementById('best').textContent=best;
 if(delivered>(+localStorage.mfBest||0))localStorage.mfBest=delivered;if(selected&&document.getElementById('panel').style.display!=='none')select(selected);
}
function drawRoad(points,color,width){
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.stroke();
}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#0b0e13';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#171e27';ctx.lineWidth=1;
 for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=0;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(const r of roads){drawRoad(r.points,'#252c35',11);drawRoad(r.points,congestion>.35?'#c58b3c':'#52606f',6)}
 if(drag&&mouse.down&&mode==='road'&&drag.points.length>1)drawRoad(drag.points,'#8bd5ff99',6);
 for(const t of trucks){const p=routePoint(t.route,t.t);ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fill()}
 for(const b of buildings){
  const pulse=Math.sin(performance.now()/500+b.pulse)*2;
  ctx.beginPath();ctx.arc(b.x,b.y,b.r+pulse,0,Math.PI*2);ctx.fillStyle='#111820';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=b.color;ctx.stroke();
  ctx.fillStyle=b.color;ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.kind==='factory'?b.type[0]:b.need[0],b.x,b.y);
  ctx.font='11px system-ui';ctx.fillStyle='#d8dee7';ctx.fillText(b.kind==='factory'?b.type:b.type,b.x,b.y+b.r+15);
  ctx.fillStyle='#202a34';ctx.fillRect(b.x-24,b.y-b.r-12,48,4);
  if(b.kind==='factory'){ctx.fillStyle=b.color;ctx.fillRect(b.x-24,b.y-b.r-12,48*(b.stock/b.max),4)}
  else{ctx.fillStyle=b.color;ctx.fillRect(b.x-24,b.y-b.r-12,48*Math.min(1,b.demand/8),4);if(b.demand>9){ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.fillText('!',b.x+19,b.y-20)}}
 }
 for(const p of particles){ctx.globalAlpha=1-p.t;ctx.fillStyle='#a7e66f';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y-p.t*30);ctx.globalAlpha=1}
 if(selected){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(selected.x,selected.y,selected.r+8,0,Math.PI*2);ctx.stroke()}
}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;tick(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
