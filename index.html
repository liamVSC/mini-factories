<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#9eaf88"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-touch-icon" content="./icon.svg"><title>Mini Factories</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css?v=1.3.3"></head><body><div id="updateRequired" style="display:none;position:fixed;inset:0;z-index:10000;place-items:center;background:rgba(36,49,58,.78);padding:20px"><div style="width:min(390px,100%);box-sizing:border-box;background:#fff9eb;color:#3f3427;border:1px solid rgba(87,67,42,.2);border-radius:18px;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.28);text-align:center;font:system-ui,sans-serif"><h2 style="margin:0 0 8px">Update available</h2><p style="margin:0 0 18px;line-height:1.45">A new version of Mini Factories is ready.</p><button id="updateRestart" style="width:100%;min-height:50px;border:0;border-radius:13px;background:#3f3427;color:#fff9eb;font:inherit;font-weight:800">↻ Load latest version</button></div></div><div id="startupGuard"><div class="startup-box"><div id="startupText">Loading Mini Factories…</div><small id="startupDetail">Starting the 3D world.</small><button id="startupRetry" class="startup-retry">Retry</button></div></div><canvas id="game"></canvas><div id="ui"></div><script>(()=>{const CURRENT='1.3.3',key='miniFactoriesRuntimeVersion',el=document.querySelector('#updateRequired'),restart=document.querySelector('#updateRestart');let refreshing=false;const hardReload=async()=>{if(refreshing)return;refreshing=true;try{localStorage.setItem(key,CURRENT)}catch{}try{const regs=await navigator.serviceWorker?.getRegistrations?.()||[];await Promise.allSettled(regs.map(r=>r.unregister()))}catch{}try{const names=await caches?.keys?.()||[];await Promise.allSettled(names.map(n=>caches.delete(n)))}catch{}location.reload()};restart?.addEventListener('click',hardReload);navigator.serviceWorker?.addEventListener?.('message',e=>{if(e.data?.type==='mini-factories-update'&&e.data.version!==CURRENT)el.style.display='grid'});try{if(localStorage.getItem(key)&&localStorage.getItem(key)!==CURRENT)el.style.display='grid'}catch{}window.addEventListener('load',async()=>{try{const regs=await navigator.serviceWorker?.getRegistrations?.()||[];await Promise.all(regs.map(r=>r.update()))}catch{}})})();</script><script type="module" src="src/game.js?v=1.3.3"></script></body></html>
